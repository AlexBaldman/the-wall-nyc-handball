name: Test and deploy GitHub Pages

on:
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Deploy this branch to the shared GitHub Pages playtest URL
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate game
        run: npm run check

      - name: Stage static site
        run: |
          mkdir _site
          cp index.html style.css app.js lab.html lab.css _site/
          cp -R outputs _site/outputs
          cp -R src _site/src
          cp -R vendor _site/vendor
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
